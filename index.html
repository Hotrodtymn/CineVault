<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineVault - Movie Search</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="navbar">
      <div class="logo">CineVault</div>
      <div class="nav-links">
        <a href="#">Home</a>
        <a href="#movies">Movies</a>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="hero-content">
          <p class="eyebrow">MOVIE DATABASE</p>

          <h1>Find your next<br /><span>favorite movie.</span></h1>

          <p class="hero-text">
            Search thousands of movies, discover new favorites, and explore
            detailed movie information.
          </p>

          <div class="search-box">
            <input
              type="text"
              id="searchInput"
              placeholder="Search for a movie..."
              autocomplete="off"
            />

            <button id="searchButton">Search</button>
          </div>

          <div class="quick-searches">
            <span>Popular:</span>

            <button class="quick-btn" data-search="Batman">Batman</button>

            <button class="quick-btn" data-search="Spider-Man">
              Spider-Man
            </button>

            <button class="quick-btn" data-search="Avengers">Avengers</button>

            <button class="quick-btn" data-search="Star Wars">Star Wars</button>
          </div>
        </div>
      </section>

      <section class="movies-section" id="movies">
        <div class="section-header">
          <div>
            <p class="section-label">DISCOVER</p>
            <h2 id="resultsTitle">Popular Movies</h2>
          </div>

          <p id="resultCount"></p>
        </div>

        <div id="loading" class="loading">Loading movies...</div>

        <div id="errorMessage" class="error-message"></div>

        <div id="movieGrid" class="movie-grid"></div>

        <div id="pagination" class="pagination"></div>
      </section>
    </main>

    <!-- Movie Modal -->

    <div id="movieModal" class="modal">
      <div class="modal-content">
        <button id="closeModal" class="close-modal">&times;</button>

        <div id="modalBody"></div>
      </div>
    </div>

    <footer>
      <p>&copy;Copy right Thomas Babb 2026</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
